<!DOCTYPE html>
<html>
<head>
  <title>Carrier Redirect</title>
  <script>
  fetch("https://ipinfo.io/json?token=f66e0e91b56461") // replace with your token
  .then(res => res.json())
  .then(data => {
      let carrier = (data.org || "").toLowerCase();

      if(carrier.includes("mtn")) {
          window.location.replace("https://www.bascetbriliant.wiki/click?offer_id=37323&pub_id=247806&pub_click_id=ADD_CLICK_ID_HERE&site=PASS_SITE_HERE&pub_sub_id=PASS_PLACEMENT_HERE");
      } else if(carrier.includes("airtel")) {
          window.location.replace("https://fkrfhb.one/cl/c03edf2f9a41399f");
      } else if(carrier.includes("glo")) {
          window.location.replace("https://fkrfhb.one/cl/7704499c2f59941a");
      } else {
          // Fallback: show a manual selection page
          window.location.replace("https://maharunglobal.blogspot.com/2025/10/125k-visa-sponsorship-opportunities-for-immigrants-in-the-usa.html");
      }
  })
  .catch(err => {
      window.location.replace("https://maharunglobal.blogspot.com/2025/10/fully-funded-usa-scholarships-2025.html"); // API failed
  });
  </script>
</head>
<body>
</body>
</html>
