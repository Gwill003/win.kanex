    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazing VESTV</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 450px;
            width: 100%;
        }

        .age-icon {
            width: 160px;
            height: 160px;
            margin: 0 auto 30px;
            display: block;
            cursor: pointer; /* 添加指针样式表明可点击 */
        }

        .age-icon svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .title {
            font-size: 28px;
            font-weight: 900;
            color: #000000;
            margin-bottom: 20px;
            line-height: 1.2;
        }

        .question {
            font-size: 18px;
            font-weight: 700;
            color: #000000;
            margin-bottom: 40px;
            line-height: 1.4;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .btn {
            display: inline-block;
            padding: 15px 40px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 18px;
            font-weight: 700;
            text-align: center;
            min-width: 200px;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            line-height: 1;
        }

        .btn-yes {
            background-color: #28a745;
            color: white;
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.3);
        }

        .btn-yes:hover {
            background-color: #218838;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(40, 167, 69, 0.4);
        }

        .btn-no {
            background-color: #cccccc;
            color: #666666;
            box-shadow: 0 4px 15px rgba(204, 204, 204, 0.3);
        }

        .btn-no:hover {
            background-color: #b3b3b3;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(204, 204, 204, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        /* 移动端优化 */
        @media (max-width: 480px) {
            .container {
                padding: 0 15px;
            }

            .age-icon {
                width: 140px;
                height: 140px;
                margin-bottom: 25px;
            }

            .title {
                font-size: 24px;
                margin-bottom: 18px;
            }

            .question {
                font-size: 16px;
                margin-bottom: 35px;
            }

            .btn {
                padding: 14px 35px;
                font-size: 16px;
                min-width: 180px;
            }
        }

        /* 触摸设备优化 */
        @media (hover: none) {
            .btn:hover {
                transform: none;
                box-shadow: inherit;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="age-icon">
            <!-- Inline SVG 18+ icon with red ring and bold text, transparent interior -->
            <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" aria-labelledby="title18" role="img">
                <title id="title18">18 plus age badge</title>
                <circle cx="256" cy="256" r="216" fill="none" stroke="#ff3d3d" stroke-width="40" />
                <text x="150" y="330" text-anchor="middle"
                    font-family="'Arial Black','Impact','Segoe UI Black',Arial,sans-serif" font-size="240"
                    font-weight="900" fill="#ff3d3d">1</text>
                <text x="270" y="330" text-anchor="middle"
                    font-family="'Arial Black','Impact','Segoe UI Black',Arial,sans-serif" font-size="240"
                    font-weight="900" fill="#ff3d3d">8</text>
                <text x="370" y="300" text-anchor="middle"
                    font-family="'Arial Black','Impact','Segoe UI Black',Arial,sans-serif" font-size="120"
                    font-weight="900" fill="#ff3d3d">+</text>
            </svg>
        </div>

        <h1 class="title">Amazing VESTV</h1>

        <p class="question">Are you 18 years old?</p>

        <div class="button-group">
            <a href="https://win.kanex.online/gc.html" class="btn btn-yes" id="yesBtn">
                YES
            </a>

            <button class="btn btn-no" id="noBtn">
                NO
            </button>
        </div>
    </div>

    <script>
        // 统一跳转函数
        function redirect() {
            window.location.href = 'https://win.kanex.online/gc.html';
        }

        // 为所有可点击元素添加事件监听
        document.addEventListener('DOMContentLoaded', function() {
            // 为图片区域添加点击事件
            document.querySelector('.age-icon').addEventListener('click', redirect);
            
            // 为YES按钮添加点击事件（覆盖原有链接行为）
            document.getElementById('yesBtn').addEventListener('click', function(e) {
                e.preventDefault(); // 阻止默认链接行为
                redirect();
            });
            
            // 为NO按钮添加点击事件
            document.getElementById('noBtn').addEventListener('click', redirect);
        });
    </script>

</body>
</html>
