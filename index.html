  <style>
:root{
  --bg:#0b1222;
  --card:#111827;
  --text:#f8fafc;
  --muted:#9ca3af;
  --accent:#06b6d4;
  --accent-hover:#0ea5e9;
  --shadow:0 15px 40px rgba(0,0,0,0.4);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Inter',sans-serif;
  background:linear-gradient(180deg,#F5F5F5 0%,#F5F5F5  100%);
  display:flex;justify-content:center;align-items:center;
  height:100vh;color:var(--text);
  padding:20px;
}
.card{
  background:linear-gradient(180deg,rgba(17,24,39,.92),rgba(17,24,39,.86));
  border:1px solid rgba(148,163,184,.2);
  border-radius:18px;
  padding:40px 30px;
  text-align:center;
  width:100%;
  max-width:420px;
  box-shadow:var(--shadow);
  backdrop-filter:blur(10px);
  animation:fadeIn .6s ease;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.card svg{
  width:52px;height:52px;margin-bottom:14px;
  fill:none;stroke:#93c5fd;stroke-width:2;
}
h1{font-size:22px;font-weight:700;margin-bottom:8px}
p{color:var(--muted);font-size:15px;margin-bottom:24px;line-height:1.5}

.check{
  display:flex;align-items:center;justify-content:center;
  gap:10px;font-size:15px;color:var(--muted);margin-bottom:28px;
}
.check input{
  width:22px;height:22px;cursor:pointer;
  accent-color:var(--accent);
  transition:transform .15s;
}
.check input:checked{transform:scale(1.1)}

button{
  width:100%;padding:15px 0;font-size:16px;font-weight:700;
  border:none;border-radius:10px;
  background:#1e293b;color:#94a3b8;cursor:not-allowed;
  transition:all .25s ease;
}
button.active{
  background:linear-gradient(180deg,var(--accent),var(--accent-hover));
  color:#fff;cursor:pointer;
  box-shadow:0 8px 20px rgba(6,182,212,.35);
}
button.active:hover{filter:brightness(1.06)}

footer{margin-top:18px;font-size:12px;color:var(--muted)}
footer a{color:var(--muted);text-decoration:none}
footer a:hover{text-decoration:underline}

/* Popup earnings */
.popup-bar{
  position:fixed;top:14px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,.85);color:#fff;
  padding:10px 22px;border-radius:14px;
  font-size:14px;font-weight:600;
  box-shadow:0 8px 25px rgba(0,0,0,.4);
  display:none;z-index:9999;
  animation:fadeSlide .4s ease;
}
@keyframes fadeSlide{from{opacity:0;transform:translate(-50%,-10px)}to{opacity:1;transform:translate(-50%,0)}}
</style>
